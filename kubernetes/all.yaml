apiVersion: apps/v1
kind: Deployment
metadata:
  name: blood-bank-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blood-bank-v1
  template:
    metadata:
      labels:
        app: blood-bank-v1
    spec:
      containers:
        - name: blood-bank
          image: shivanksharma070/blood-bank:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DATA_FILE
              value: /data/donors.json
          volumeMounts:
            - name: donor-data
              mountPath: /data
      volumes:
        - name: donor-data
          hostPath:
            path: /data/v1
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: blood-bank-v1-service
spec:
  type: NodePort
  selector:
    app: blood-bank-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
---
